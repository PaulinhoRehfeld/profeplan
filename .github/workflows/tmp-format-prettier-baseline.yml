name: Temporary Prettier Baseline Formatter

on:
  push:
    branches:
      - fix/prettier-baseline-2026-08-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout formatter branch
        uses: actions/checkout@v4
        with:
          ref: fix/prettier-baseline-2026-08-13

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install

      - name: Format CI baseline files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/LoginScreen.tsx \
            apps/web/src/pages/CancelamentoFormulario.tsx \
            apps/web/src/pages/CancelamentoReembolso.tsx \
            apps/web/src/pages/DadosEducacionais.tsx \
            apps/web/src/pages/DireitosTitular.tsx \
            apps/web/src/pages/PoliticaCookies.tsx \
            apps/web/src/pages/PoliticaPrivacidade.tsx \
            apps/web/src/pages/SegurancaLGPD.tsx \
            apps/web/src/pages/TermosDeUso.tsx \
            apps/web/src/pages/TransparenciaIA.tsx \
            api/ai.ts

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/LoginScreen.tsx \
            apps/web/src/pages/CancelamentoFormulario.tsx \
            apps/web/src/pages/CancelamentoReembolso.tsx \
            apps/web/src/pages/DadosEducacionais.tsx \
            apps/web/src/pages/DireitosTitular.tsx \
            apps/web/src/pages/PoliticaCookies.tsx \
            apps/web/src/pages/PoliticaPrivacidade.tsx \
            apps/web/src/pages/SegurancaLGPD.tsx \
            apps/web/src/pages/TermosDeUso.tsx \
            apps/web/src/pages/TransparenciaIA.tsx \
            api/ai.ts
          git commit -m "style: normalize Prettier CI baseline"
          git push origin HEAD:fix/prettier-baseline-2026-08-13
