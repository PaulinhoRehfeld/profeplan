name: Credit Accounting 1.3C.3 Positive Producers CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/credit-accounting-1-3c-3-positive-producers-ci.yml'
      - 'infra/supabase/migrations/202608142140_credit_accounting_schema.sql'
      - 'infra/supabase/migrations/202608142230_credit_accounting_commands.sql'
      - 'infra/supabase/migrations/202608142231_credit_accounting_command_invariants.sql'
      - 'infra/supabase/migrations/20260813_stripe_webhook_fulfillment.sql'
      - 'infra/supabase/migrations/202608150225_credit_positive_producer_convergence.sql'
      - 'supabase/tests/fixtures/credit_accounting_minimal_baseline.sql'
      - 'supabase/tests/fixtures/credit_positive_producer_baseline.sql'
      - 'supabase/tests/credit_positive_producer_convergence.sql'
      - 'apps/web/src/services/credits/creditProducerFlags.ts'
      - 'apps/web/src/services/referrals/referrals.ts'
      - 'apps/web/src/services/admin/adminProfiles.ts'
      - 'apps/web/src/services/profile/profileRepository.ts'
      - 'apps/web/src/hooks/useProfeplanAuth.ts'
      - 'apps/web/src/components/Admin/components/AddCreditsModal.tsx'
      - 'apps/web/src/components/Admin/components/UserList.tsx'
      - 'apps/web/src/components/Admin/components/CreateUserModal.tsx'
      - 'apps/web/src/components/Admin/components/__tests__/*creditProducer*'
      - 'apps/web/src/services/**/__tests__/*creditProducer*'
      - 'api/auth/admin-create-user.ts'
      - 'docs/commercial/LOT-1.3C.3-POSITIVE-PRODUCER-CONVERGENCE.md'
      - 'docs/commercial/LOT-1.3C.4E-FINAL-CONSUMER-SWEEP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-positive-producers:
    name: Prove 1.3C.3 positive producers on disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CREDIT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CREDIT_WORKDIR: .credit-1-3c-3-supabase-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare disposable Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CREDIT_WORKDIR"
          mkdir -p "$CREDIT_WORKDIR"

          (
            cd "$CREDIT_WORKDIR"
            supabase init --force
            mkdir -p supabase/migrations

            cp ../supabase/tests/fixtures/credit_accounting_minimal_baseline.sql \
              supabase/migrations/202608142130_credit_accounting_test_baseline.sql
            cp ../supabase/tests/fixtures/credit_positive_producer_baseline.sql \
              supabase/migrations/202608142135_credit_positive_producer_test_baseline.sql
            cp ../infra/supabase/migrations/202608142140_credit_accounting_schema.sql \
              supabase/migrations/202608142140_credit_accounting_schema.sql
            cp ../infra/supabase/migrations/202608142230_credit_accounting_commands.sql \
              supabase/migrations/202608142230_credit_accounting_commands.sql
            cp ../infra/supabase/migrations/202608142231_credit_accounting_command_invariants.sql \
              supabase/migrations/202608142231_credit_accounting_command_invariants.sql
            cp ../infra/supabase/migrations/20260813_stripe_webhook_fulfillment.sql \
              supabase/migrations/202608142240_stripe_webhook_fulfillment.sql
            cp ../infra/supabase/migrations/202608150225_credit_positive_producer_convergence.sql \
              supabase/migrations/202608150225_credit_positive_producer_convergence.sql
          )

          echo "Prepared disposable 1.3C.3 inputs for commit $GITHUB_SHA."

      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          START_LOG="$(mktemp)"
          if ! (
            cd "$CREDIT_WORKDIR"
            supabase start \
              -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
          ) >"$START_LOG" 2>&1; then
            DIAGNOSTIC_LINE_COUNT="$(wc -l < "$START_LOG")"
            rm -f "$START_LOG"
            echo "Disposable Supabase stack failed to start."
            echo "Raw startup output suppressed because it may contain disposable credentials."
            echo "Captured diagnostic lines: $DIAGNOSTIC_LINE_COUNT"
            exit 1
          fi
          rm -f "$START_LOG"
          echo "Disposable Supabase stack started; generated local credentials omitted."

      - name: Prove governed positive producers
        shell: bash
        run: |
          set -euo pipefail
          psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/credit_positive_producer_convergence.sql \
            | tee credit-positive-producers.log

          grep -q 'OK:credit_positive_producer_convergence_1_3C_3' \
            credit-positive-producers.log

      - name: Lint disposable database
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$CREDIT_WORKDIR"
            supabase db lint --level warning
          )

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -d "$CREDIT_WORKDIR/supabase" ]; then
            (
              cd "$CREDIT_WORKDIR"
              supabase stop --no-backup || true
            ) >/dev/null 2>&1
          fi
