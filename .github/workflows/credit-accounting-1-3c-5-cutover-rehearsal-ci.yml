name: Credit Accounting 1.3C.5 Integral Cutover Rehearsal CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/credit-accounting-1-3c-5-cutover-rehearsal-ci.yml'
      - 'infra/supabase/migrations/202608142140_credit_accounting_schema.sql'
      - 'infra/supabase/migrations/202608142230_credit_accounting_commands.sql'
      - 'infra/supabase/migrations/202608142231_credit_accounting_command_invariants.sql'
      - 'infra/supabase/migrations/20260813_stripe_webhook_fulfillment.sql'
      - 'infra/supabase/migrations/202608150115_credit_term_plan_atomic_save_pilot.sql'
      - 'infra/supabase/migrations/202608150225_credit_positive_producer_convergence.sql'
      - 'infra/supabase/migrations/202608150330_credit_generated_content_atomic_save.sql'
      - 'infra/supabase/migrations/202608151530_credit_pdi_atomic_save.sql'
      - 'supabase/tests/fixtures/credit_accounting_minimal_baseline.sql'
      - 'supabase/tests/fixtures/credit_positive_producer_baseline.sql'
      - 'supabase/tests/fixtures/credit_term_plan_pilot_baseline.sql'
      - 'supabase/tests/fixtures/credit_generated_content_baseline.sql'
      - 'supabase/tests/fixtures/credit_legacy_cutover_snapshot.sql'
      - 'supabase/tests/fixtures/credit_cutover_integrated_pdi_baseline.sql'
      - 'supabase/tests/credit_legacy_balance_cutover_rehearsal.sql'
      - 'supabase/tests/credit_legacy_balance_integrated_rehearsal.sql'
      - 'supabase/tests/credit_positive_producer_convergence.sql'
      - 'supabase/tests/credit_positive_producer_integrated_smoke.sql'
      - 'supabase/tests/credit_cutover_integral_rehearsal.sql'
      - 'scripts/credit-consumer-final-sweep.mjs'
      - 'apps/web/src/services/credits/creditConsumerFlags.ts'
      - 'apps/web/src/services/credits/creditProducerFlags.ts'
      - 'apps/web/src/services/credits/creditPilotFlags.ts'
      - 'docs/commercial/LOT-1.3C.5-CUTOVER-ENFORCEMENT-REHEARSAL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-integral-cutover-rehearsal:
    name: Prove integral cutover and rollback on disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CREDIT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CREDIT_WORKDIR: .credit-1-3c-5-supabase-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prove active runtime authority sweep
        run: node scripts/credit-consumer-final-sweep.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare integrated disposable Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CREDIT_WORKDIR"
          mkdir -p "$CREDIT_WORKDIR"

          (
            cd "$CREDIT_WORKDIR"
            supabase init --force
            mkdir -p supabase/migrations

            cp ../supabase/tests/fixtures/credit_accounting_minimal_baseline.sql \
              supabase/migrations/202608142130_credit_accounting_test_baseline.sql
            cp ../supabase/tests/fixtures/credit_positive_producer_baseline.sql \
              supabase/migrations/202608142131_credit_positive_producer_test_baseline.sql
            cp ../supabase/tests/fixtures/credit_term_plan_pilot_baseline.sql \
              supabase/migrations/202608142132_credit_term_plan_test_baseline.sql
            cp ../supabase/tests/fixtures/credit_generated_content_baseline.sql \
              supabase/migrations/202608142133_credit_generated_content_test_baseline.sql
            cp ../supabase/tests/fixtures/credit_cutover_integrated_pdi_baseline.sql \
              supabase/migrations/202608142134_credit_cutover_integrated_pdi_baseline.sql
            cp ../supabase/tests/fixtures/credit_legacy_cutover_snapshot.sql \
              supabase/migrations/202608142135_credit_legacy_cutover_snapshot_fixture.sql
            cp ../infra/supabase/migrations/202608142140_credit_accounting_schema.sql \
              supabase/migrations/202608142140_credit_accounting_schema.sql
            cp ../infra/supabase/migrations/202608142230_credit_accounting_commands.sql \
              supabase/migrations/202608142230_credit_accounting_commands.sql
            cp ../infra/supabase/migrations/202608142231_credit_accounting_command_invariants.sql \
              supabase/migrations/202608142231_credit_accounting_command_invariants.sql
            cp ../infra/supabase/migrations/20260813_stripe_webhook_fulfillment.sql \
              supabase/migrations/202608142240_stripe_webhook_fulfillment.sql
            cp ../infra/supabase/migrations/202608150115_credit_term_plan_atomic_save_pilot.sql \
              supabase/migrations/202608150115_credit_term_plan_atomic_save_pilot.sql
            cp ../infra/supabase/migrations/202608150225_credit_positive_producer_convergence.sql \
              supabase/migrations/202608150225_credit_positive_producer_convergence.sql
            cp ../infra/supabase/migrations/202608150330_credit_generated_content_atomic_save.sql \
              supabase/migrations/202608150330_credit_generated_content_atomic_save.sql
            cp ../infra/supabase/migrations/202608151530_credit_pdi_atomic_save.sql \
              supabase/migrations/202608151530_credit_pdi_atomic_save.sql
          )

          echo "Prepared integrated disposable 1.3C.5 inputs for commit $GITHUB_SHA."

      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          START_LOG="$(mktemp)"
          if ! (
            cd "$CREDIT_WORKDIR"
            supabase start \
              -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
          ) >"$START_LOG" 2>&1; then
            DIAGNOSTIC_LINE_COUNT="$(wc -l < "$START_LOG")"
            rm -f "$START_LOG"
            echo "Disposable Supabase stack failed to start."
            echo "Raw startup output suppressed because it may contain disposable credentials."
            echo "Captured diagnostic lines: $DIAGNOSTIC_LINE_COUNT"
            exit 1
          fi
          rm -f "$START_LOG"
          echo "Disposable Supabase stack started; generated local credentials omitted."

      - name: Prove conservative legacy balance import on integrated schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/credit_legacy_balance_integrated_rehearsal.sql \
            | tee credit-legacy-balance-1-3c-5.log

          grep -q 'OK:credit_legacy_balance_integrated_rehearsal_1_3C_5' \
            credit-legacy-balance-1-3c-5.log

      - name: Prove governed positive producers on integrated schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/credit_positive_producer_integrated_smoke.sql \
            | tee credit-positive-producers-1-3c-5.log

          grep -q 'OK:credit_positive_producer_integrated_smoke_1_3C_5' \
            credit-positive-producers-1-3c-5.log

      - name: Prove enforcement, governed saves and rollback
        shell: bash
        run: |
          set -euo pipefail
          psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/credit_cutover_integral_rehearsal.sql \
            | tee credit-cutover-integral-1-3c-5.log

          grep -q 'OK:credit_cutover_integral_rehearsal_1_3C_5' \
            credit-cutover-integral-1-3c-5.log

      - name: Lint disposable database
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$CREDIT_WORKDIR"
            supabase db lint --level warning
          )

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -d "$CREDIT_WORKDIR/supabase" ]; then
            (
              cd "$CREDIT_WORKDIR"
              supabase stop --no-backup || true
            ) >/dev/null 2>&1
          fi
