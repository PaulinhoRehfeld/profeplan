name: Temporary credential migration formatter

on:
  push:
    branches:
      - agent/credential-incident-side-by-side-migration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/credential-incident-side-by-side-migration

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format credential migration files
        run: |
          pnpm exec prettier --write \
            api/_lib/supabaseCredentials.ts \
            api/_lib/supabaseAdmin.ts \
            api/auth/signup.ts \
            api/searchProxy.ts \
            api/ai/embeddings.ts \
            apps/web/src/__tests__/supabaseCredentials.test.ts

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/_lib/supabaseCredentials.ts \
            api/_lib/supabaseAdmin.ts \
            api/auth/signup.ts \
            api/searchProxy.ts \
            api/ai/embeddings.ts \
            apps/web/src/__tests__/supabaseCredentials.test.ts
          git commit -m "style(security): apply canonical formatter"
          git push origin HEAD:agent/credential-incident-side-by-side-migration
