name: Credit Accounting 1.3C.4A Generated Content CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/credit-accounting-1-3c-4a-generated-content-ci.yml'
      - 'infra/supabase/migrations/202608142140_credit_accounting_schema.sql'
      - 'infra/supabase/migrations/202608142230_credit_accounting_commands.sql'
      - 'infra/supabase/migrations/202608142231_credit_accounting_command_invariants.sql'
      - 'infra/supabase/migrations/202608150330_credit_generated_content_atomic_save.sql'
      - 'supabase/tests/fixtures/credit_accounting_minimal_baseline.sql'
      - 'supabase/tests/fixtures/credit_generated_content_baseline.sql'
      - 'supabase/tests/credit_generated_content_atomic_save.sql'
      - 'supabase/tests/credit_generated_content_concurrency_assert.sql'
      - 'apps/web/src/services/credits/creditConsumerFlags.ts'
      - 'apps/web/src/features/Planning/PlanningService.ts'
      - 'apps/web/src/services/ai/AiChatService.ts'
      - 'apps/web/src/services/ai/AiPlanningService.ts'
      - 'apps/web/src/**/__tests__/*creditConsumer*'
      - 'docs/commercial/LOT-1.3C.4-CONSUMER-MAP.md'
      - 'docs/commercial/LOT-1.3C.4A-GENERATED-CONTENT-SAVE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-generated-content-save:
    name: Prove 1.3C.4A first-save economics on disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CREDIT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CREDIT_WORKDIR: .credit-1-3c-4a-supabase-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare disposable Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CREDIT_WORKDIR"
          mkdir -p "$CREDIT_WORKDIR"

          (
            cd "$CREDIT_WORKDIR"
            supabase init --force
            mkdir -p supabase/migrations

            cp ../supabase/tests/fixtures/credit_accounting_minimal_baseline.sql \
              supabase/migrations/202608142130_credit_accounting_test_baseline.sql
            cp ../supabase/tests/fixtures/credit_generated_content_baseline.sql \
              supabase/migrations/202608142135_credit_generated_content_test_baseline.sql
            cp ../infra/supabase/migrations/202608142140_credit_accounting_schema.sql \
              supabase/migrations/202608142140_credit_accounting_schema.sql
            cp ../infra/supabase/migrations/202608142230_credit_accounting_commands.sql \
              supabase/migrations/202608142230_credit_accounting_commands.sql
            cp ../infra/supabase/migrations/202608142231_credit_accounting_command_invariants.sql \
              supabase/migrations/202608142231_credit_accounting_command_invariants.sql
            cp ../infra/supabase/migrations/202608150330_credit_generated_content_atomic_save.sql \
              supabase/migrations/202608150330_credit_generated_content_atomic_save.sql
          )

          echo "Prepared disposable 1.3C.4A inputs for commit $GITHUB_SHA."

      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          START_LOG="$(mktemp)"
          if ! (
            cd "$CREDIT_WORKDIR"
            supabase start \
              -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
          ) >"$START_LOG" 2>&1; then
            DIAGNOSTIC_LINE_COUNT="$(wc -l < "$START_LOG")"
            rm -f "$START_LOG"
            echo "Disposable Supabase stack failed to start."
            echo "Raw startup output suppressed because it may contain disposable credentials."
            echo "Captured diagnostic lines: $DIAGNOSTIC_LINE_COUNT"
            exit 1
          fi
          rm -f "$START_LOG"
          echo "Disposable Supabase stack started; generated local credentials omitted."

      - name: Prove first-save, edit, insufficiency, Gold, ownership and rollback
        shell: bash
        run: |
          set -euo pipefail
          psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/credit_generated_content_atomic_save.sql \
            | tee credit-generated-content-4a.log

          grep -q 'OK:credit_generated_content_atomic_save_1_3C_4A' \
            credit-generated-content-4a.log

      - name: Prove eight parallel first-save requests converge to one debit
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/credit-4a-parallel-*.log

          pids=()
          for i in $(seq 1 8); do
            (
              psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 >"/tmp/credit-4a-parallel-${i}.log" 2>&1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config(
            'request.jwt.claim.sub',
            '00000000-0000-4000-8000-000000000505',
            true
          );
          SELECT set_config(
            'request.jwt.claims',
            '{"sub":"00000000-0000-4000-8000-000000000505","role":"authenticated"}',
            true
          );
          SELECT public.credit_save_generated_content(
            'artifact-4a-505-concurrent',
            'plano',
            'PLANOS DE AULA',
            'Concorrência 4A',
            'Oito sessões, um artefato e um débito',
            '2026-08-15 02:20:00+00'
          );
          COMMIT;
          SQL
            ) &
            pids+=("$!")
          done

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo 'One or more parallel save sessions failed.'
            grep -hE 'ERROR|FATAL|DETAIL|CONTEXT' /tmp/credit-4a-parallel-*.log || true
            exit 1
          fi

          psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/credit_generated_content_concurrency_assert.sql \
            | tee credit-generated-content-concurrency-4a.log

          grep -q 'OK:credit_generated_content_concurrency_1_3C_4A' \
            credit-generated-content-concurrency-4a.log

      - name: Lint disposable database
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$CREDIT_WORKDIR"
            supabase db lint --level warning
          )

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -d "$CREDIT_WORKDIR/supabase" ]; then
            (
              cd "$CREDIT_WORKDIR"
              supabase stop --no-backup || true
            ) >/dev/null 2>&1
          fi
