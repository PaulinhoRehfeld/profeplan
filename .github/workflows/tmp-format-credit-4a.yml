name: Temporary Format Credit 4A

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-format-credit-4a.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/web/src/features/Planning/PlanningService.ts \
            apps/web/src/features/Planning/__tests__/PlanningService.creditConsumer.test.ts \
            apps/web/src/services/__tests__/quota.creditConsumer.test.ts \
            apps/web/src/services/ai/AiChatService.ts \
            apps/web/src/services/credits/creditConsumerFlags.ts \
            apps/web/src/services/credits/quota.ts

      - name: Remove temporary workflow and push formatted files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-format-credit-4a.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/tmp-format-credit-4a.yml \
            apps/web/src/features/Planning/PlanningService.ts \
            apps/web/src/features/Planning/__tests__/PlanningService.creditConsumer.test.ts \
            apps/web/src/services/__tests__/quota.creditConsumer.test.ts \
            apps/web/src/services/ai/AiChatService.ts \
            apps/web/src/services/credits/creditConsumerFlags.ts \
            apps/web/src/services/credits/quota.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style(commercial): apply repository prettier to 1.3C.4A'
          git push origin HEAD:${{ github.head_ref }}
