name: C4 Prettier Probe

on:
  push:
    branches:
      - feat/knowledge-factory-c4-minimal-confirmation

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write packages/knowledge-factory/src/reconstruction/structural-confirmation.service.ts
          git diff -- packages/knowledge-factory/src/reconstruction/structural-confirmation.service.ts
