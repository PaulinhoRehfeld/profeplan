name: Knowledge Factory C.2.4 Discard Repair

on:
  push:
    branches:
      - feat/knowledge-factory-lot-c2-4-recovery

permissions:
  contents: write

jobs:
  repair:
    name: Repair C.2.4 discard physical-state reconciliation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-lot-c2-4-recovery
          fetch-depth: 1

      - name: Apply exact proven repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          adapter = Path('packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts')
          text = adapter.read_text()

          old = """    const path = objectPath(input.run.id, artifactId);
    const { folder, filename } = pathParts(path);
    const bucket = this.context.client.storage.from(this.bucketName);

    try {
      const { data: before, error: beforeError } = await bucket.list(folder, {
        limit: 2,
        search: filename,
      });
      if (beforeError !== null) {
        throw toPersistenceError(beforeError, operation);
      }

      const existsBefore = (before ?? []).some((item) => item.name === filename);
      if (!existsBefore) {"""
          new = """    const path = objectPath(input.run.id, artifactId);
    const bucket = this.context.client.storage.from(this.bucketName);

    try {
      const { data: existsBefore, error: beforeError } = await bucket.exists(path);
      if (beforeError !== null) {
        throw toPersistenceError(beforeError, operation);
      }

      if (!existsBefore) {"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one discard pre-check block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """      const { data: remaining, error: listError } = await bucket.list(folder, {
        limit: 2,
        search: filename,
      });

      if (listError !== null) {
        throw toPersistenceError(listError, operation);
      }

      if ((remaining ?? []).some((item) => item.name === filename)) {
        throw toPersistenceError({ message: 'delete verification failed' }, operation);
      }"""
          new = """      const { data: existsAfter, error: existsError } = await bucket.exists(path);

      if (existsError !== null) {
        throw toPersistenceError(existsError, operation);
      }

      if (existsAfter) {
        throw toPersistenceError({ message: 'delete verification failed' }, operation);
      }"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one discard post-check block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          adapter.write_text(text)

          unit = Path('packages/knowledge-factory-supabase/test/staging.repository.test.mjs')
          text = unit.read_text()
          old = "const calls = { upload: [], download: [], remove: [], list: [] };"
          new = "const calls = { upload: [], download: [], remove: [], list: [], exists: [] };"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one calls declaration, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    async remove(paths) {
      calls.remove.push(paths);
      if (behavior.removeError) return { data: null, error: behavior.removeError };
      for (const path of paths) objects.delete(path);
      return { data: paths.map((name) => ({ name })), error: null };
    },"""
          new = """    async remove(paths) {
      calls.remove.push(paths);
      if (behavior.removeError) {
        if (behavior.deleteBeforeRemoveError) {
          for (const path of paths) objects.delete(path);
        }
        return { data: null, error: behavior.removeError };
      }
      for (const path of paths) objects.delete(path);
      return { data: paths.map((name) => ({ name })), error: null };
    },"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one remove mock, found {text.count(old)}')
          text = text.replace(old, new, 1)

          needle = """    async list(folder, options) {
      calls.list.push({ folder, options });
      if (behavior.listError) return { data: null, error: behavior.listError };
      if (behavior.keepAfterRemove) {
        return { data: [{ name: options.search }], error: null };
      }
      const prefix = `${folder}/`;
      const data = [...objects.keys()]
        .filter((path) => path.startsWith(prefix))
        .map((path) => ({ name: path.slice(prefix.length) }))
        .filter((item) => !options.search || item.name.includes(options.search));
      return { data, error: null };
    },"""
          replacement = needle + """
    async exists(path) {
      calls.exists.push(path);
      if (behavior.existsError) return { data: false, error: behavior.existsError };
      if (behavior.keepAfterRemove) return { data: true, error: null };
      return { data: objects.has(path), error: null };
    },"""
          if text.count(needle) != 1:
              raise SystemExit(f'Expected one list mock, found {text.count(needle)}')
          text = text.replace(needle, replacement, 1)

          marker = """test('unverified deletion fails closed with sanitized error', async () => {"""
          added = """test('lost delete response reconciles to already_discarded on retry without a second physical delete', async () => {
  const fake = fakeContext({
    deleteBeforeRemoveError: true,
    removeError: { message: 'network timeout after provider delete' },
  });
  const adapter = new SupabaseTemporaryStagingAdapter(fake.context, {
    bucketName: 'private-test-bucket',
    now: () => '2026-08-14T21:05:00.000Z',
  });
  const descriptor = await adapter.stage(write());
  const command = {
    artifact: descriptor.artifact,
    run,
    requestedAt: '2026-08-14T21:04:59.000Z',
    reasonCode: 'technical_failure',
    correlationId: 'correlation-synthetic-1',
  };

  await assert.rejects(
    adapter.discard(command),
    (error) =>
      error.code === 'UNAVAILABLE' && !error.message.includes('network timeout after provider delete')
  );
  assert.equal(fake.objects.size, 0);

  const retry = await adapter.discard({
    ...command,
    requestedAt: '2026-08-14T21:05:01.000Z',
  });
  assert.equal(retry.outcome, 'already_discarded');
  assert.equal(fake.calls.remove.length, 1);
});

""" + marker
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one unverified deletion marker, found {text.count(marker)}')
          text = text.replace(marker, added, 1)
          unit.write_text(text)

          integration = Path('packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs')
          text = integration.read_text()
          old = """    assert.equal(repeated.state, 'DISCARDED');
    assert.equal(repeated.outcome, 'discarded');"""
          new = """    assert.equal(repeated.state, 'DISCARDED');
    assert.equal(repeated.outcome, 'already_discarded');"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one repeated C.2.2 assertion, found {text.count(old)}')
          integration.write_text(text.replace(old, new, 1))
          PY

          npx --yes prettier@3.8.4 --write \
            packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts \
            packages/knowledge-factory-supabase/test/staging.repository.test.mjs \
            packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs
          npx --yes prettier@3.8.4 --check \
            packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts \
            packages/knowledge-factory-supabase/test/staging.repository.test.mjs \
            packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts \
            packages/knowledge-factory-supabase/test/staging.repository.test.mjs \
            packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs | sort)"
          test "$changed" = "$expected"
          git diff --stat

      - name: Commit proven discard repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Repair already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts \
            packages/knowledge-factory-supabase/test/staging.repository.test.mjs \
            packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs
          git diff --cached --check
          git commit -m 'fix(knowledge-factory): reconcile discard state by object existence'
          git push origin HEAD:feat/knowledge-factory-lot-c2-4-recovery
