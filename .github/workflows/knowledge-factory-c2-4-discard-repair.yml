name: Knowledge Factory C.2.4 Discard Repair

on:
  push:
    branches:
      - feat/knowledge-factory-lot-c2-4-recovery

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-lot-c2-4-recovery
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact repair
        run: python .github/scripts/c2-4-discard-repair.py
      - name: Format and verify scope
        run: |
          npx --yes prettier@3.8.4 --write packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts packages/knowledge-factory-supabase/test/staging.repository.test.mjs packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs
          npx --yes prettier@3.8.4 --check packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts packages/knowledge-factory-supabase/test/staging.repository.test.mjs packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs packages/knowledge-factory-supabase/test/staging.repository.test.mjs | sort)"
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/knowledge-factory-supabase/src/staging/supabase-temporary-staging.adapter.ts packages/knowledge-factory-supabase/test/staging.repository.test.mjs packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs
          git commit -m 'fix(knowledge-factory): reconcile discard state by object existence'
          git push origin HEAD:feat/knowledge-factory-lot-c2-4-recovery
