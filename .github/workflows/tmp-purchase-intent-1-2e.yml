name: Temporary purchase intent patch 1.2E

on:
  push:
    branches:
      - fix/site-commercial-offer-consistency
    paths:
      - .github/workflows/tmp-purchase-intent-1-2e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/site-commercial-offer-consistency
          fetch-depth: 0

      - name: Apply Sublote 1.2E purchase-intent flow
        run: |
          python - <<'PY'
          from pathlib import Path

          # Landing: never send anonymous visitors directly to Stripe.
          site = Path('apps/site/src/main.tsx')
          text = site.read_text()
          old = """const SILVER_CHECKOUT_URL = 'https://buy.stripe.com/28E3cudNyajg3UHbAm2VG00';\nconst SILVER_PROMOTION_CODE = 'TEST_DRIVE';\nconst GOLD_CHECKOUT_URL =\n  'https://buy.stripe.com/8x2bJ010Mdvs76T0VI2VG01?prefilled_promo_code=BOFNZFBM';"""
          new = """const SILVER_PURCHASE_URL = `${APP_URL}/signup?plan=silver`;\nconst SILVER_PROMOTION_CODE = 'TEST_DRIVE';\nconst GOLD_PURCHASE_URL = `${APP_URL}/signup?plan=gold`;"""
          assert old in text, 'landing checkout constants pattern not found'
          text = text.replace(old, new, 1)
          text = text.replace('href={SILVER_CHECKOUT_URL}', 'href={SILVER_PURCHASE_URL}', 1)
          text = text.replace('href={GOLD_CHECKOUT_URL}', 'href={GOLD_PURCHASE_URL}', 1)
          text = text.replace(
              'aria-label={`Comprar ProfePlan Silver: 40 créditos, pagamento único. Primeira compra por R$ 40,00 usando o código ${SILVER_PROMOTION_CODE}; preço regular R$ 50,00.`}',
              'aria-label={`Continuar para o ProfePlan Silver: crie ou acesse sua conta antes do checkout. 40 créditos, pagamento único; primeira compra por R$ 40,00 usando o código ${SILVER_PROMOTION_CODE}; preço regular R$ 50,00.`}',
              1,
          )
          text = text.replace(
              'aria-label="Assinar ProfePlan Gold por R$ 37,50 ao mês durante 6 meses; depois R$ 50,00 ao mês."',
              'aria-label="Continuar para o ProfePlan Gold: crie ou acesse sua conta antes do checkout. R$ 37,50 ao mês durante 6 meses; depois R$ 50,00 ao mês."',
              1,
          )
          text = text.replace(
              'Usar código {SILVER_PROMOTION_CODE} no Stripe →',
              'Criar conta e continuar →',
              1,
          )
          text = text.replace(
              'Desconto pré-preenchido no Stripe →',
              'Criar conta e continuar →',
              1,
          )
          old_note = """Silver: desconto de R$ 10,00 restrito à primeira transação. Gold: 25% de desconto por 6\n          meses. A elegibilidade e o valor final são confirmados no checkout seguro da Stripe."""
          new_note = """Silver: desconto de R$ 10,00 restrito à primeira transação. Gold: 25% de desconto por 6\n          meses. Primeiro você cria ou acessa sua conta ProfePlan; depois, o valor final é confirmado\n          no checkout seguro da Stripe."""
          assert old_note in text, 'landing offer note pattern not found'
          text = text.replace(old_note, new_note, 1)
          site.write_text(text)

          # RootLayout: persist purchase intent across auth/email verification/school selection.
          root = Path('apps/web/src/layouts/RootLayout.tsx')
          text = root.read_text()
          marker = "import { isPublicPath } from '../router/publicRoutes';\n"
          addition = """import { isPublicPath } from '../router/publicRoutes';\n\nconst PURCHASE_INTENT_STORAGE_KEY = 'profeplan:purchase-intent';\n"""
          assert marker in text and 'PURCHASE_INTENT_STORAGE_KEY' not in text, 'RootLayout import marker not found or already patched'
          text = text.replace(marker, addition, 1)
          marker = "  const location = useLocation();\n\n  const { showEmergencyReset } = useAppBootstrap({"
          addition = """  const location = useLocation();\n\n  React.useEffect(() => {\n    const plan = new URLSearchParams(location.search).get('plan')?.toLowerCase();\n    if (plan !== 'silver' && plan !== 'gold') return;\n\n    localStorage.setItem(\n      PURCHASE_INTENT_STORAGE_KEY,\n      JSON.stringify({ plan, createdAt: Date.now() })\n    );\n  }, [location.search]);\n\n  const { showEmergencyReset } = useAppBootstrap({"""
          assert marker in text, 'RootLayout location marker not found'
          text = text.replace(marker, addition, 1)
          root.write_text(text)

          # AppLayout: consume intent only after authenticated profile is available.
          app = Path('apps/web/src/layouts/AppLayout.tsx')
          text = app.read_text()
          marker = "import { clearLocalSession } from '../utils/authUtils';\n"
          addition = """import { clearLocalSession } from '../utils/authUtils';\n\nconst PURCHASE_INTENT_STORAGE_KEY = 'profeplan:purchase-intent';\nconst PURCHASE_INTENT_TTL_MS = 24 * 60 * 60 * 1000;\n"""
          assert marker in text and 'PURCHASE_INTENT_TTL_MS' not in text, 'AppLayout import marker not found or already patched'
          text = text.replace(marker, addition, 1)
          marker = "  const setIsSubscriptionOpen = useUIStore((s) => s.setIsSubscriptionOpen);\n\n  const handleLogout = async () => {"
          addition = """  const setIsSubscriptionOpen = useUIStore((s) => s.setIsSubscriptionOpen);\n\n  React.useEffect(() => {\n    if (!session?.isLoggedIn || !userProfile?.id) return;\n\n    const stored = localStorage.getItem(PURCHASE_INTENT_STORAGE_KEY);\n    if (!stored) return;\n\n    try {\n      const intent = JSON.parse(stored) as { plan?: unknown; createdAt?: unknown };\n      const validPlan = intent.plan === 'silver' || intent.plan === 'gold';\n      const createdAt = typeof intent.createdAt === 'number' ? intent.createdAt : 0;\n      const stillValid = Date.now() - createdAt <= PURCHASE_INTENT_TTL_MS;\n\n      if (validPlan && stillValid) {\n        setIsSubscriptionOpen(true);\n      }\n    } catch {\n      // Invalid/stale intent is discarded below.\n    } finally {\n      localStorage.removeItem(PURCHASE_INTENT_STORAGE_KEY);\n    }\n  }, [session?.isLoggedIn, userProfile?.id, setIsSubscriptionOpen]);\n\n  const handleLogout = async () => {"""
          assert marker in text, 'AppLayout subscription marker not found'
          text = text.replace(marker, addition, 1)
          app.write_text(text)
          PY

      - name: Format changed files
        run: pnpm exec prettier --write apps/site/src/main.tsx apps/web/src/layouts/RootLayout.tsx apps/web/src/layouts/AppLayout.tsx

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-purchase-intent-1-2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/src/main.tsx apps/web/src/layouts/RootLayout.tsx apps/web/src/layouts/AppLayout.tsx .github/workflows/tmp-purchase-intent-1-2e.yml
          git commit -m "fix(payments): require identified account before checkout"
          git push origin HEAD:fix/site-commercial-offer-consistency
