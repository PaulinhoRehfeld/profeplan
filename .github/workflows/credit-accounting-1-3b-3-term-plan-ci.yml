name: Credit Accounting 1.3B.3 TermPlan Atomic Save CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/credit-accounting-1-3b-3-term-plan-ci.yml'
      - 'infra/supabase/migrations/202608142140_credit_accounting_schema.sql'
      - 'infra/supabase/migrations/202608142230_credit_accounting_commands.sql'
      - 'infra/supabase/migrations/202608142231_credit_accounting_command_invariants.sql'
      - 'infra/supabase/migrations/202608150115_credit_term_plan_atomic_save_pilot.sql'
      - 'supabase/tests/fixtures/credit_accounting_minimal_baseline.sql'
      - 'supabase/tests/fixtures/credit_term_plan_pilot_baseline.sql'
      - 'supabase/tests/credit_term_plan_atomic_save.sql'
      - 'supabase/tests/credit_term_plan_atomic_save_concurrency_assert.sql'
      - 'apps/web/src/services/credits/creditPilotFlags.ts'
      - 'apps/web/src/services/orchestration/PlanningOrchestrator.ts'
      - 'apps/web/src/features/TermPlanning/TermPlanningService.ts'
      - 'apps/web/src/features/TermPlanning/__tests__/TermPlanningService.test.ts'
      - 'apps/web/src/services/databaseService.ts'
      - 'docs/commercial/LOT-1.3B.3-TERM-PLAN-ATOMIC-SAVE-PILOT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-term-plan-atomic-save:
    name: Prove 1.3B.3 TermPlan save on disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CREDIT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CREDIT_WORKDIR: .credit-1-3b-3-supabase-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare disposable Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CREDIT_WORKDIR"
          mkdir -p "$CREDIT_WORKDIR"

          (
            cd "$CREDIT_WORKDIR"
            supabase init --force
            mkdir -p supabase/migrations
            cp ../supabase/tests/fixtures/credit_accounting_minimal_baseline.sql \
              supabase/migrations/202608142130_credit_accounting_test_baseline.sql
            cp ../supabase/tests/fixtures/credit_term_plan_pilot_baseline.sql \
              supabase/migrations/202608142135_credit_term_plan_test_baseline.sql
            cp ../infra/supabase/migrations/202608142140_credit_accounting_schema.sql \
              supabase/migrations/202608142140_credit_accounting_schema.sql
            cp ../infra/supabase/migrations/202608142230_credit_accounting_commands.sql \
              supabase/migrations/202608142230_credit_accounting_commands.sql
            cp ../infra/supabase/migrations/202608142231_credit_accounting_command_invariants.sql \
              supabase/migrations/202608142231_credit_accounting_command_invariants.sql
            cp ../infra/supabase/migrations/202608150115_credit_term_plan_atomic_save_pilot.sql \
              supabase/migrations/202608150115_credit_term_plan_atomic_save_pilot.sql
          )

          echo "Prepared disposable 1.3B.3 inputs for commit $GITHUB_SHA."

      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          START_LOG="$(mktemp)"
          if ! (
            cd "$CREDIT_WORKDIR"
            supabase start \
              -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
          ) >"$START_LOG" 2>&1; then
            DIAGNOSTIC_LINE_COUNT="$(wc -l < "$START_LOG")"
            rm -f "$START_LOG"
            echo "Disposable Supabase stack failed to start."
            echo "Raw startup output suppressed because it may contain disposable credentials."
            echo "Captured diagnostic lines: $DIAGNOSTIC_LINE_COUNT"
            exit 1
          fi
          rm -f "$START_LOG"
          echo "Disposable Supabase stack started; generated local credentials omitted."

      - name: Prove atomic save, replay, Gold, rejection, ownership and rollback
        shell: bash
        run: |
          set -euo pipefail
          psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/credit_term_plan_atomic_save.sql \
            | tee credit-term-plan-validation.log
          grep -q 'OK:credit_term_plan_atomic_save_1_3B_3' \
            credit-term-plan-validation.log

      - name: Prove parallel exact-save idempotency
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for i in $(seq 1 8); do
            psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
              -c "BEGIN;
                  SET LOCAL ROLE authenticated;
                  SELECT set_config(
                    'request.jwt.claim.sub',
                    '00000000-0000-0000-0000-000000000206',
                    true
                  );
                  SELECT set_config(
                    'request.jwt.claims',
                    '{\"sub\":\"00000000-0000-0000-0000-000000000206\",\"role\":\"authenticated\"}',
                    true
                  );
                  SELECT public.credit_save_term_plan(
                    'plan-concurrent-206',
                    'Plano concorrente',
                    1,
                    'Trimestre',
                    'História',
                    '1º Ano EM',
                    'Ensino Médio',
                    2,
                    '{}'::jsonb,
                    24,
                    '{}'::jsonb,
                    'Minas Gerais',
                    'Estadual',
                    'CONCORRENCIA-EXATA',
                    '[]'::jsonb
                  );
                  COMMIT;" \
              >"/tmp/credit-term-plan-concurrent-${i}.log" 2>&1 &
            pids+=("$!")
          done

          failures=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "Parallel governed term-plan sessions failed: $failures"
            exit 1
          fi

          psql "$CREDIT_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/credit_term_plan_atomic_save_concurrency_assert.sql \
            | tee credit-term-plan-concurrency-validation.log
          grep -q 'OK:credit_term_plan_atomic_save_concurrency_1_3B_3' \
            credit-term-plan-concurrency-validation.log

      - name: Lint disposable database
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$CREDIT_WORKDIR"
            supabase db lint --level warning
          )

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -d "$CREDIT_WORKDIR/supabase" ]; then
            (
              cd "$CREDIT_WORKDIR"
              supabase stop --no-backup || true
            ) >/dev/null 2>&1
          fi
