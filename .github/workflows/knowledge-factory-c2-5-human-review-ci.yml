name: Knowledge Factory C.2.5 Human Review CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/knowledge-factory-c2-5-human-review-ci.yml'
      - 'packages/types/src/knowledge-factory/ingestion-review-handoff.ts'
      - 'packages/types/src/knowledge-factory/index.ts'
      - 'packages/knowledge-factory/src/repositories/ingestion.repository.ts'
      - 'packages/knowledge-factory-supabase/src/ingestion/**'
      - 'packages/knowledge-factory-supabase/src/index.ts'
      - 'packages/knowledge-factory-supabase/test/ingestion*'
      - 'supabase/migrations/202608151600_kf_ingestion_human_review_handoff.sql'
      - 'supabase/tests/knowledge_factory_ingestion_c2_5*'
      - 'docs/profeplan-knowledge-factory/12-delivery/LOT-C2-5-HUMAN-REVIEW-AND-C3-HANDOFF.md'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-c2-5-human-review:
    name: Prove C.2.5 review and handoff on disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      KF_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      KF_WORKDIR: .kf-c2-5-supabase-ci
      KF_EVIDENCE: .kf-evidence/knowledge-factory-c2-5-human-review-validation.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare disposable Knowledge Factory baseline through C.1.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KF_WORKDIR" .kf-evidence
          mkdir -p "$KF_WORKDIR" .kf-evidence
          (
            cd "$KF_WORKDIR"
            supabase init --force
            mkdir -p supabase/migrations
            cp ../supabase/tests/fixtures/knowledge_factory_minimal_baseline.sql \
              supabase/migrations/202608071100_kf_test_baseline.sql
            cp ../supabase/migrations/202608071120_knowledge_factory_schema.sql \
              supabase/migrations/202608071120_knowledge_factory_schema.sql
            cp ../supabase/migrations/202608122230_kf_source_lifecycle_persistence.sql \
              supabase/migrations/202608122230_kf_source_lifecycle_persistence.sql
          )
          {
            echo "Knowledge Factory C.2.5 disposable human review validation"
            echo "UTC start: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: $GITHUB_SHA"
            echo "Supabase CLI: $(supabase --version)"
            echo "Docker: $(docker --version)"
            echo "PostgreSQL client: $(psql --version)"
          } | tee "$KF_EVIDENCE"

      - name: Start disposable Supabase
        shell: bash
        run: |
          set -euo pipefail
          START_LOG="$(mktemp)"
          if ! (
            cd "$KF_WORKDIR"
            supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
          ) >"$START_LOG" 2>&1; then
            LINES="$(wc -l < "$START_LOG")"
            rm -f "$START_LOG"
            echo "Disposable Supabase baseline failed to start; raw output suppressed."
            echo "Captured diagnostic lines: $LINES"
            exit 1
          fi
          echo "Disposable Supabase baseline started; generated credentials omitted." \
            | tee -a "$KF_EVIDENCE"
          rm -f "$START_LOG"

      - name: Apply C.1 competence authority and C.2.4 durable boundary
        shell: bash
        run: |
          set -euo pipefail
          psql "$KF_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202608141120_kf_source_lifecycle_command_boundary.sql \
            2>&1 | tee -a "$KF_EVIDENCE"
          psql "$KF_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202608150140_kf_ingestion_recovery_boundary.sql \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Prove unchanged C.2.4 boundary before C.2.5 extension
        shell: bash
        run: |
          set -euo pipefail
          psql "$KF_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/knowledge_factory_ingestion_c2_4.sql \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Apply C.2.5 migration explicitly
        shell: bash
        run: |
          set -euo pipefail
          psql "$KF_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202608151600_kf_ingestion_human_review_handoff.sql \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Typecheck governed boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @profeplan/types typecheck 2>&1 | tee -a "$KF_EVIDENCE"
          pnpm --filter @profeplan/knowledge-factory typecheck 2>&1 | tee -a "$KF_EVIDENCE"
          pnpm --filter @profeplan/knowledge-factory-supabase typecheck 2>&1 | tee -a "$KF_EVIDENCE"

      - name: Unit-test review, handoff and provider-neutral adapters
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            packages/knowledge-factory/test/ingestion.test.mjs \
            packages/knowledge-factory/test/ingestion-recovery.test.mjs \
            2>&1 | tee -a "$KF_EVIDENCE"
          node --experimental-transform-types --test \
            packages/knowledge-factory-supabase/test/ingestion-command.repository.test.mjs \
            packages/knowledge-factory-supabase/test/ingestion-handoff.repository.test.mjs \
            packages/knowledge-factory-supabase/test/ingestion-recovery.repository.test.mjs \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Prove human authorization, audit evidence and least privilege
        shell: bash
        run: |
          set -euo pipefail
          psql "$KF_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/knowledge_factory_ingestion_c2_5.sql \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Prove deliberate partial-failure rollback
        shell: bash
        run: |
          set -euo pipefail
          psql "$KF_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/knowledge_factory_ingestion_c2_5_atomicity.sql \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Prove real multi-session idempotency and decision races
        shell: bash
        run: |
          set -euo pipefail
          bash supabase/tests/knowledge_factory_ingestion_c2_5_concurrency.sh \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Regression-test C.2.2-C.2.4 after C.2.5
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            packages/knowledge-factory/test/staging.test.mjs \
            packages/knowledge-factory/test/integrity.test.mjs \
            packages/knowledge-factory/test/ingestion-recovery.test.mjs \
            2>&1 | tee -a "$KF_EVIDENCE"
          psql "$KF_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/knowledge_factory_ingestion_c2_4_atomicity.sql \
            2>&1 | tee -a "$KF_EVIDENCE"
          bash supabase/tests/knowledge_factory_ingestion_c2_4_concurrency.sh \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Verify C.2.5 has no C.3 execution surface
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn \
            'startExtraction|executeExtraction|enqueueExtraction|publishExtractionJob|createExtractionJob' \
            packages/types/src/knowledge-factory/ingestion-review-handoff.ts \
            packages/knowledge-factory/src/repositories/ingestion.repository.ts \
            packages/knowledge-factory-supabase/src/ingestion \
            supabase/migrations/202608151600_kf_ingestion_human_review_handoff.sql; then
            echo "C.3 execution surface leaked into C.2.5"
            exit 1
          fi
          echo "C.2.5 exposes persisted eligibility evidence only." | tee -a "$KF_EVIDENCE"

      - name: Finalize evidence
        if: always()
        shell: bash
        run: |
          {
            echo "UTC finish: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
          } >> "$KF_EVIDENCE"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-factory-c2-5-human-review-validation-${{ github.run_id }}
          path: .kf-evidence/knowledge-factory-c2-5-human-review-validation.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -f "$KF_WORKDIR/supabase/config.toml" ]; then
            (cd "$KF_WORKDIR" && supabase stop --no-backup || true)
          fi