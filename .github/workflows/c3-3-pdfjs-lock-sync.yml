name: C.3.3 PDF.js Lock Sync

on:
  push:
    branches:
      - feat/knowledge-factory-c3-3-pdfjs-native-parser
    paths:
      - packages/knowledge-factory/package.json
      - .github/workflows/c3-3-pdfjs-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'sync C.3.3 PDF.js lockfile') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-c3-3-pdfjs-native-parser
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit canonical lockfile delta
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(knowledge-factory): sync C.3.3 PDF.js lockfile"
          git push origin HEAD:feat/knowledge-factory-c3-3-pdfjs-native-parser
