name: Temporary cartography Prettier diff

on:
  push:
    branches:
      - feat/knowledge-factory-structural-recognition-contract

permissions:
  contents: read

jobs:
  show-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write packages/types/src/knowledge-factory/cartography.ts
          git diff -- packages/types/src/knowledge-factory/cartography.ts
          test -n "$(git status --short packages/types/src/knowledge-factory/cartography.ts)"
