name: One-shot promo link hotfix

on:
  push:
    branches:
      - hotfix/prefill-august-promo-codes
    paths:
      - .github/workflows/hotfix-prefill-promo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/prefill-august-promo-codes
          fetch-depth: 0
      - name: Prefill August promotion codes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/site/src/main.tsx')
          text = path.read_text()
          old_silver = "const SILVER_CHECKOUT_URL = 'https://buy.stripe.com/28E3cudNyajg3UHbAm2VG00';"
          old_gold = "const GOLD_CHECKOUT_URL = 'https://buy.stripe.com/8x2bJ010Mdvs76T0VI2VG01';"
          new_silver = "const SILVER_CHECKOUT_URL = 'https://buy.stripe.com/28E3cudNyajg3UHbAm2VG00?prefilled_promo_code=LENA';"
          new_gold = "const GOLD_CHECKOUT_URL = 'https://buy.stripe.com/8x2bJ010Mdvs76T0VI2VG01?prefilled_promo_code=JUJU';"
          if text.count(old_silver) != 1 or text.count(old_gold) != 1:
              raise SystemExit('Expected checkout URL constants were not found exactly once')
          text = text.replace(old_silver, new_silver).replace(old_gold, new_gold)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/hotfix-prefill-promo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/src/main.tsx
          git commit -m "fix(site): prefill August promotion codes"
          git push origin HEAD:hotfix/prefill-august-promo-codes
