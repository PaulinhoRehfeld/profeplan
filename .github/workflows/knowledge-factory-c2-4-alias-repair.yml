name: Knowledge Factory C.2.4 Alias Repair

on:
  push:
    branches:
      - feat/knowledge-factory-lot-c2-4-recovery

permissions:
  contents: write

jobs:
  repair-alias:
    name: Apply proven C.2.4 authorization alias fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-lot-c2-4-recovery
          fetch-depth: 1

      - name: Replace reserved authorization alias exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/202608150140_kf_ingestion_recovery_boundary.sql')
          text = path.read_text()
          old = """    SELECT 1 FROM public.kf_source_authorizations AS authorization
              WHERE authorization.id = p_authorization_id
                AND authorization.subject_identity_id = p_source_version_id
                AND authorization.purpose = p_purpose
                AND authorization.projected_state = 'GRANTED'
                AND p_evaluated_at >= authorization.effective_from
                AND (authorization.effective_until IS NULL OR p_evaluated_at <= authorization.effective_until)"""
          new = """    SELECT 1 FROM public.kf_source_authorizations AS authz
              WHERE authz.id = p_authorization_id
                AND authz.subject_identity_id = p_source_version_id
                AND authz.purpose = p_purpose
                AND authz.projected_state = 'GRANTED'
                AND p_evaluated_at >= authz.effective_from
                AND (authz.effective_until IS NULL OR p_evaluated_at <= authz.effective_until)"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one authorization alias block; found {count}')
          updated = text.replace(old, new, 1)
          path.write_text(updated)
          PY

          git diff --check
          test "$(git diff --numstat -- supabase/migrations/202608150140_kf_ingestion_recovery_boundary.sql | awk '{print $1":"$2}')" = "7:7"
          git diff -- supabase/migrations/202608150140_kf_ingestion_recovery_boundary.sql

      - name: Commit minimal migration repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/202608150140_kf_ingestion_recovery_boundary.sql
          git diff --cached --check
          git commit -m 'fix(knowledge-factory): avoid reserved authorization alias'
          git push origin HEAD:feat/knowledge-factory-lot-c2-4-recovery
