name: Knowledge Factory C.2.2 Staging CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/knowledge-factory-c2-2-staging-ci.yml'
      - 'packages/types/src/knowledge-factory/staging.ts'
      - 'packages/types/src/knowledge-factory/index.ts'
      - 'packages/knowledge-factory/src/domain/reasons.ts'
      - 'packages/knowledge-factory/src/policies/staging.ts'
      - 'packages/knowledge-factory/src/staging/**'
      - 'packages/knowledge-factory/src/index.ts'
      - 'packages/knowledge-factory/test/staging.test.mjs'
      - 'packages/knowledge-factory-supabase/src/staging/**'
      - 'packages/knowledge-factory-supabase/src/index.ts'
      - 'packages/knowledge-factory-supabase/test/staging*'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-c2-2-staging:
    name: Validate C.2.2 staging on disposable Supabase Storage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KF_WORKDIR: .kf-c2-2-supabase-ci
      KF_EVIDENCE: .kf-evidence/knowledge-factory-c2-2-staging-validation.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KF_WORKDIR" .kf-evidence
          mkdir -p "$KF_WORKDIR" .kf-evidence
          (
            cd "$KF_WORKDIR"
            supabase init --force
          )

          {
            echo "Knowledge Factory C.2.2 disposable staging validation"
            echo "UTC start: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: $GITHUB_SHA"
            echo "Supabase CLI: $(supabase --version)"
            echo "Docker: $(docker --version)"
          } | tee "$KF_EVIDENCE"

      - name: Start disposable Supabase with Storage enabled
        shell: bash
        run: |
          set -euo pipefail
          START_LOG="$(mktemp)"
          if ! (
            cd "$KF_WORKDIR"
            supabase start \
              -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
          ) >"$START_LOG" 2>&1; then
            DIAGNOSTIC_LINE_COUNT="$(wc -l < "$START_LOG")"
            rm -f "$START_LOG"
            echo "Disposable Supabase stack failed to start."
            echo "Raw startup output suppressed because it may contain disposable credentials."
            echo "Captured diagnostic lines: $DIAGNOSTIC_LINE_COUNT"
            exit 1
          fi
          echo "Disposable Supabase stack started with Storage enabled; generated local credentials omitted." \
            | tee -a "$KF_EVIDENCE"
          rm -f "$START_LOG"

      - name: Capture disposable Supabase credentials safely
        shell: bash
        run: |
          set -euo pipefail
          STATUS_ENV="$(mktemp)"
          (
            cd "$KF_WORKDIR"
            supabase status -o env
          ) > "$STATUS_ENV"

          read_local_value() {
            local name="$1"
            sed -n "s/^${name}=//p" "$STATUS_ENV" | head -n 1 | sed 's/^"//;s/"$//'
          }

          KF_SUPABASE_URL="$(read_local_value API_URL)"
          KF_SUPABASE_SERVICE_ROLE_KEY="$(read_local_value SERVICE_ROLE_KEY)"
          KF_SUPABASE_ANON_KEY="$(read_local_value ANON_KEY)"

          if [ -z "$KF_SUPABASE_URL" ] || [ -z "$KF_SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$KF_SUPABASE_ANON_KEY" ]; then
            rm -f "$STATUS_ENV"
            echo "Disposable Supabase credentials could not be resolved."
            exit 1
          fi

          echo "::add-mask::$KF_SUPABASE_SERVICE_ROLE_KEY"
          echo "::add-mask::$KF_SUPABASE_ANON_KEY"
          {
            echo "KF_SUPABASE_URL=$KF_SUPABASE_URL"
            echo "KF_SUPABASE_SERVICE_ROLE_KEY=$KF_SUPABASE_SERVICE_ROLE_KEY"
            echo "KF_SUPABASE_ANON_KEY=$KF_SUPABASE_ANON_KEY"
          } >> "$GITHUB_ENV"
          rm -f "$STATUS_ENV"

      - name: Typecheck staging packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @profeplan/types typecheck 2>&1 | tee -a "$KF_EVIDENCE"
          pnpm --filter @profeplan/knowledge-factory typecheck 2>&1 | tee -a "$KF_EVIDENCE"
          pnpm --filter @profeplan/knowledge-factory-supabase typecheck 2>&1 | tee -a "$KF_EVIDENCE"

      - name: Unit-test C.2.2 provider-neutral policy and adapter boundary
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test packages/knowledge-factory/test/staging.test.mjs \
            2>&1 | tee -a "$KF_EVIDENCE"
          node --experimental-transform-types --test \
            packages/knowledge-factory-supabase/test/staging.repository.test.mjs \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Integration-test disposable Storage isolation and discard
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @profeplan/knowledge-factory-supabase test:integration -- \
            packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs \
            2>&1 | tee -a "$KF_EVIDENCE"

      - name: Finalize evidence
        if: always()
        shell: bash
        run: |
          {
            echo "UTC finish: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
          } >> "$KF_EVIDENCE"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-factory-c2-2-staging-validation-${{ github.run_id }}
          path: .kf-evidence/knowledge-factory-c2-2-staging-validation.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -f "$KF_WORKDIR/supabase/config.toml" ]; then
            (
              cd "$KF_WORKDIR"
              supabase stop --no-backup || true
            )
          fi
