name: Knowledge Factory C.2.4 Post-Merge Docs

on:
  push:
    branches:
      - docs/knowledge-factory-c2-4-post-merge
    paths:
      - '.github/workflows/kf-c2-4-post-merge-docs.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/knowledge-factory-c2-4-post-merge
          fetch-depth: 0

      - name: Align temporary reconciliation script with actual Blueprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/scripts/reconcile_c2_4_post_merge.py')
          text = path.read_text(encoding='utf-8')
          pattern = r"replace_once\(\n    BLUEPRINT,\n    '\*\*Definição documental integrada pelo PR nº 59\..*?\n\)\n"
          text, count = re.subn(pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one obsolete Blueprint replacement block, found {count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply governed documentation reconciliation
        id: apply
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python .github/scripts/reconcile_c2_4_post_merge.py > /tmp/reconcile.log 2>&1
          rc=$?
          cat /tmp/reconcile.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/reconcile.log .github/reconcile-c2-4-error.txt
          fi
          exit "$rc"

      - name: Persist diagnostic on failure
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/scripts/reconcile_c2_4_post_merge.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/reconcile-c2-4-error.txt
          git commit -m 'chore(knowledge-factory): capture C.2.4 docs reconciliation error'
          git push origin HEAD:docs/knowledge-factory-c2-4-post-merge
          exit 1

      - name: Validate scope and commit
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/scripts/reconcile_c2_4_post_merge.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'docs/profeplan-knowledge-factory/12-delivery/LOT-C2-4-IDEMPOTENCY-RECOVERY-AND-FAIL-SAFE.md' \
            'docs/profeplan-knowledge-factory/12-delivery/PHASE-C-EXECUTION-MAP.md' \
            'docs/profeplan-knowledge-factory/BLUEPRINT.md' \
            'docs/profeplan-knowledge-factory/README.md' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected documentation scope:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/profeplan-knowledge-factory
          git commit -m 'docs(knowledge-factory): reconcile C.2.4 post-merge state'
          git push origin HEAD:docs/knowledge-factory-c2-4-post-merge
