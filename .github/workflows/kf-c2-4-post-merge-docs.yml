name: Knowledge Factory C.2.4 Post-Merge Docs

on:
  push:
    branches:
      - docs/knowledge-factory-c2-4-post-merge
    paths:
      - '.github/workflows/kf-c2-4-post-merge-docs.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/knowledge-factory-c2-4-post-merge
          fetch-depth: 0

      - name: Apply governed documentation reconciliation
        run: python .github/scripts/reconcile_c2_4_post_merge.py

      - name: Validate scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'docs/profeplan-knowledge-factory/12-delivery/LOT-C2-4-IDEMPOTENCY-RECOVERY-AND-FAIL-SAFE.md' \
            'docs/profeplan-knowledge-factory/12-delivery/PHASE-C-EXECUTION-MAP.md' \
            'docs/profeplan-knowledge-factory/BLUEPRINT.md' \
            'docs/profeplan-knowledge-factory/README.md' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected documentation scope:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/profeplan-knowledge-factory
          git commit -m 'docs(knowledge-factory): reconcile C.2.4 post-merge state'
          git push origin HEAD:docs/knowledge-factory-c2-4-post-merge
