name: Recovery - reconcile Knowledge Factory histories

on:
  push:
    branches:
      - recovery/reconcile-release-kf-2026-08-13-v2
    paths:
      - .github/workflows/recovery-reconcile-kf.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify governed anchors
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "recovery/reconcile-release-kf-2026-08-13-v2"
          git merge-base --is-ancestor 27da5989ea920060466f65889b4c5560048fc447 HEAD
          git cat-file -e 7faf6af817099ce45757d606b392695bc4baee0d^{commit}
          if git merge-base --is-ancestor af4c68622b125317b16ac895ef39d4e61a62537e HEAD; then
            echo "C.1.3 must not be present in recovery before reconciliation" >&2
            exit 1
          fi

      - name: Merge intact Knowledge Factory lineage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit 7faf6af817099ce45757d606b392695bc4baee0d
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$merge_rc" -ne 0 ]; then
            if [ "$conflicts" != "pnpm-lock.yaml" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              git merge --abort
              exit 1
            fi
            git checkout --ours pnpm-lock.yaml
            git add pnpm-lock.yaml
          elif [ -n "$conflicts" ]; then
            echo "Unexpected unresolved files after successful merge:" >&2
            printf '%s\n' "$conflicts" >&2
            git merge --abort
            exit 1
          fi

      - name: Regenerate combined pnpm lockfile
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rebuild lockfile from reconciled manifests
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          grep -q '^  apps/site:' pnpm-lock.yaml
          grep -q '^  packages/knowledge-factory-supabase:' pnpm-lock.yaml
          test -f packages/types/src/knowledge-factory/source-lifecycle.ts
          test -f supabase/migrations/202608122230_kf_source_lifecycle_persistence.sql
          test -f .github/workflows/knowledge-factory-db-ci.yml
          git add pnpm-lock.yaml

      - name: Remove one-shot recovery workflow and commit merge
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/recovery-reconcile-kf.yml
          test -f apps/site/index.html
          test -f docs/profeplan-knowledge-factory/00-governance/CONTINUITY-CHECKPOINT-038.md
          test ! -f docs/profeplan-knowledge-factory/12-delivery/LOT-C1-3-ATOMIC-BOUNDARY.md || {
            echo "Unexpected C.1.3 artifact detected" >&2
            exit 1
          }
          git commit \
            -m "recovery(knowledge-factory): reconcile application and C.1.2 histories" \
            -m "Preserves current application/site lineage and the intact Knowledge Factory lineage through 7faf6af only. Regenerates pnpm-lock.yaml from the combined workspace. C.1.3, C.1.4 and C.2 remain excluded."
          git push origin HEAD:recovery/reconcile-release-kf-2026-08-13-v2
