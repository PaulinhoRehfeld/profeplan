name: Temporary Knowledge Factory package test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - name: Run Knowledge Factory package tests
        run: pnpm --filter @profeplan/knowledge-factory test
