name: C.3.4 Qualify run_id Fix

on:
  push:
    branches:
      - feat/knowledge-factory-c3-4-incremental-persistence
    paths:
      - '.github/workflows/c3-4-qualify-run-id-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-c3-4-incremental-persistence
          fetch-depth: 0
      - name: Qualify C.3.4 element lookup
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/migrations/202608181310_kf_extraction_incremental_persistence.sql')
          text = path.read_text()
          old = """      FROM public.kf_extraction_elements\n      WHERE run_id = p_run_id AND physical_page_number = v_page_number;"""
          new = """      FROM public.kf_extraction_elements AS existing_element\n      WHERE existing_element.run_id = p_run_id\n        AND existing_element.physical_page_number = v_page_number;"""
          if old not in text:
              raise SystemExit('target SQL fragment not found')
          path.write_text(text.replace(old, new))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608181310_kf_extraction_incremental_persistence.sql
          git commit -m "fix(knowledge-factory): qualify C.3.4 element lookup"
          git push origin HEAD:feat/knowledge-factory-c3-4-incremental-persistence
