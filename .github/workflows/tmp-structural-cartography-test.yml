name: Temporary structural cartography dependency fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  dependency-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - name: Add runtime workspace dependency
        run: pnpm --filter @profeplan/knowledge-factory add '@profeplan/types@workspace:*'
      - name: Commit package and lockfile
        run: |
          if git diff --quiet -- packages/knowledge-factory/package.json pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/knowledge-factory/package.json pnpm-lock.yaml
          git commit -m "fix(knowledge-factory): declare types runtime dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
