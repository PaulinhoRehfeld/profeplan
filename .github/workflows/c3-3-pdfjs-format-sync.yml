name: C.3.3 PDF.js Format Sync

on:
  push:
    branches:
      - feat/knowledge-factory-c3-3-pdfjs-native-parser
    paths:
      - .github/workflows/c3-3-pdfjs-format-sync.yml

permissions:
  contents: write

jobs:
  format-adapter:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-c3-3-pdfjs-native-parser
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier exactly
        run: pnpm exec prettier --write packages/knowledge-factory/src/extraction/pdfjs-native-text-extractor.adapter.ts

      - name: Commit formatter result
        run: |
          if git diff --quiet -- packages/knowledge-factory/src/extraction/pdfjs-native-text-extractor.adapter.ts; then
            echo "Adapter already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/knowledge-factory/src/extraction/pdfjs-native-text-extractor.adapter.ts
          git commit -m "style(knowledge-factory): apply Prettier to PDF.js adapter"
          git push origin HEAD:feat/knowledge-factory-c3-3-pdfjs-native-parser
