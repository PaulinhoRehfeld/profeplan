name: Temporary 4E Canonical Formatting

on:
  push:
    branches:
      - feat/commercial-credit-consumers-4e-final-sweep
    paths:
      - .github/workflows/temp-4e-prettier.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-credit-consumers-4e-final-sweep

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install

      - name: Format only CI-identified 4E files
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/Admin/components/__tests__/CreateUserModal.creditProducer.test.tsx
          apps/web/src/components/Admin/components/CreateUserModal.tsx
          apps/web/src/components/Sidebar.tsx
          api/auth/admin-create-user.ts

      - name: Remove temporary workflow and commit canonical formatting
        run: |
          rm .github/workflows/temp-4e-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/Admin/components/__tests__/CreateUserModal.creditProducer.test.tsx \
            apps/web/src/components/Admin/components/CreateUserModal.tsx \
            apps/web/src/components/Sidebar.tsx \
            api/auth/admin-create-user.ts \
            .github/workflows/temp-4e-prettier.yml
          git commit -m "style(commercial): apply canonical formatting to 4E"
          git push
