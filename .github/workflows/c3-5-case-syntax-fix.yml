name: C.3.5 Restore and Syntax Fix

on:
  push:
    branches:
      - feat/knowledge-factory-c3-5-quality-review
    paths:
      - '.github/workflows/c3-5-case-syntax-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-c3-5-quality-review
          fetch-depth: 0
      - name: Restore migration and patch CASE comparison
        shell: bash
        run: |
          set -euo pipefail
          path='supabase/migrations/202608181340_kf_extraction_quality_review.sql'
          git show a2c6ab0f8d57420aa4cb9d230b5815deb628b595:"$path" > "$path"
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202608181340_kf_extraction_quality_review.sql')
          text = path.read_text()
          old = """    IF public.kf_extraction_text_internal(v_evidence->'checkpoint','authorizationEvidence.checkpoint')
            <> CASE WHEN p_operation='begin_extraction' THEN 'claim' ELSE 'finalization' END THEN"""
          new = """    IF public.kf_extraction_text_internal(v_evidence->'checkpoint','authorizationEvidence.checkpoint')
            <> (CASE WHEN p_operation='begin_extraction' THEN 'claim' ELSE 'finalization' END) THEN"""
          if old not in text:
              old = """    IF public.kf_extraction_text_internal(v_evidence->'checkpoint','authorizationEvidence.checkpoint')
              <> CASE WHEN p_operation='begin_extraction' THEN 'claim' ELSE 'finalization' END THEN"""
              new = """    IF public.kf_extraction_text_internal(v_evidence->'checkpoint','authorizationEvidence.checkpoint')
              <> (CASE WHEN p_operation='begin_extraction' THEN 'claim' ELSE 'finalization' END) THEN"""
          if old not in text:
              old = """    IF public.kf_extraction_text_internal(v_evidence->'checkpoint','authorizationEvidence.checkpoint')
      <> CASE WHEN p_operation='begin_extraction' THEN 'claim' ELSE 'finalization' END THEN"""
              new = """    IF public.kf_extraction_text_internal(v_evidence->'checkpoint','authorizationEvidence.checkpoint')
      <> (CASE WHEN p_operation='begin_extraction' THEN 'claim' ELSE 'finalization' END) THEN"""
          if old not in text:
              raise SystemExit('target CASE comparison not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repaired migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608181340_kf_extraction_quality_review.sql
          git commit -m "fix(knowledge-factory): restore and fix C.3.5 authorization CASE"
          git push origin HEAD:feat/knowledge-factory-c3-5-quality-review
