name: Knowledge Factory C.2.4 Minimize Discard Tests

on:
  push:
    branches:
      - feat/knowledge-factory-lot-c2-4-recovery

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-lot-c2-4-recovery
          fetch-depth: 0
      - name: Restore validated baseline and reapply only semantic test changes
        run: python .github/scripts/c2-4-minimize-discard-tests.py
      - name: Verify exact scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs packages/knowledge-factory-supabase/test/staging.repository.test.mjs | sort)"
      - name: Commit minimal test diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/knowledge-factory-supabase/test/staging.c2-2.integration.test.mjs packages/knowledge-factory-supabase/test/staging.repository.test.mjs
          git commit -m 'test(knowledge-factory): minimize C.2.4 discard regression diff'
          git push origin HEAD:feat/knowledge-factory-lot-c2-4-recovery
