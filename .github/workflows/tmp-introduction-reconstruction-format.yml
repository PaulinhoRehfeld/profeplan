name: Temporary Introduction reconstruction formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: |
          pnpm exec prettier --write \
            packages/knowledge-factory/src/reconstruction/part-reconstruction.service.ts \
            packages/types/src/knowledge-factory/reconstruction.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- packages/knowledge-factory/src/reconstruction/part-reconstruction.service.ts packages/types/src/knowledge-factory/reconstruction.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/knowledge-factory/src/reconstruction/part-reconstruction.service.ts packages/types/src/knowledge-factory/reconstruction.ts
          git commit -m "style(knowledge-factory): format Introduction reconstruction"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
