name: Knowledge Factory C.2.4 Prettier Repair

on:
  push:
    branches:
      - feat/knowledge-factory-lot-c2-4-recovery

permissions:
  contents: write

jobs:
  repair:
    name: Format only proven C.2.4 offenders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-factory-lot-c2-4-recovery
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact Prettier 3.8.4 repair
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/knowledge-factory-supabase/src/ingestion/ingestion-command.mapper.ts
            packages/knowledge-factory-supabase/src/ingestion/supabase-ingestion-recovery.repository.ts
          )
          npx --yes prettier@3.8.4 --write "${files[@]}"
          npx --yes prettier@3.8.4 --check "${files[@]}"

          if git diff --quiet -- "${files[@]}"; then
            echo 'No formatting repair required.'
            exit 0
          fi

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$changed" = "$expected"
          git diff --check
          git diff -- "${files[@]}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -m 'style(knowledge-factory): format remaining C.2.4 sources'
          git push origin HEAD:feat/knowledge-factory-lot-c2-4-recovery
