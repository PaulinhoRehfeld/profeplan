name: Temporary 4E Auth Producer Patch

on:
  push:
    branches:
      - feat/commercial-credit-consumers-4e-final-sweep
    paths:
      - .github/workflows/temp-4e-auth-producer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-credit-consumers-4e-final-sweep

      - name: Patch emergency profile credit producer
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/hooks/useProfeplanAuth.ts')
          text = path.read_text()

          old_import = "import { isHardcodedAdmin } from '../constants';\n"
          new_import = old_import + "import { isGovernedCreditProducerEnabled } from '../services/credits/creditProducerFlags';\n"
          if old_import not in text:
              raise SystemExit('Auth import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_anchor = """          const isAdminEmail = isHardcodedAdmin(userEmail);\n          const { data: upsertData, error: upsertError } = await supabase.from('profiles').upsert(\n"""
          new_anchor = """          const isAdminEmail = isHardcodedAdmin(userEmail);\n          const governedCreditProducers = isGovernedCreditProducerEnabled();\n          const { data: upsertData, error: upsertError } = await supabase.from('profiles').upsert(\n"""
          if old_anchor not in text:
              raise SystemExit('Emergency creation anchor not found')
          text = text.replace(old_anchor, new_anchor, 1)

          old_credits = """              tier: isAdminEmail ? 'GOLD' : 'FREE',\n              credits: isAdminEmail ? 9999 : 10,\n              is_unlimited: isAdminEmail,\n"""
          new_credits = """              tier: isAdminEmail ? 'GOLD' : 'FREE',\n              ...(governedCreditProducers ? {} : { credits: isAdminEmail ? 9999 : 10 }),\n              is_unlimited: isAdminEmail,\n"""
          if old_credits not in text:
              raise SystemExit('Emergency credits anchor not found')
          text = text.replace(old_credits, new_credits, 1)
          path.write_text(text)

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/temp-4e-auth-producer-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/hooks/useProfeplanAuth.ts .github/workflows/temp-4e-auth-producer-patch.yml
          git commit -m "feat(commercial): govern emergency profile credit producer"
          git push
