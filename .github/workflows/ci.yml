name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-checks:
    name: Lint & Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      # Escopo restrito ao código ativo (apps/web/src, api/, packages/*/src) —
      # `pnpm prettier --check .` no repo inteiro resolvia pro script
      # "prettier --write ." do package.json (pnpm agrega --check como
      # argumento extra em vez de invocar o binário puro) e nunca checava
      # nada de verdade. `pnpm exec` invoca o binário direto.
      - name: Run Code Formatter Check (Prettier)
        run: pnpm exec prettier --check "apps/web/src/**/*.{ts,tsx}" "api/**/*.ts" "packages/*/src/**/*.ts"

      # apps/bff (stub de Azure Functions) e packages/db, packages/ai, packages/auth
      # (stack Prisma/Next.js morto, nunca implantado — ver
      # docs/handoff-2026-07-10-auditoria-e-plano.md) quebram lint/typecheck/build:
      # apps/bff por dependência ausente (@google/generative-ai); packages/db por
      # faltar `prisma generate` (Prisma Client não gerado no CI); packages/ai por
      # importar o source (não builda) de packages/db. Nenhum é usado pelo app real
      # (vercel.json builda só apps/web) — excluídos destes 3 steps.
      - name: Run Linter (ESLint)
        run: pnpm --filter '!./apps/bff' --filter '!./packages/db' --filter '!./packages/ai' --filter '!./packages/auth' -r lint

      - name: Run Typecheck (TypeScript)
        run: pnpm --filter '!./apps/bff' --filter '!./packages/db' --filter '!./packages/ai' --filter '!./packages/auth' -r typecheck

      - name: Run Build
        run: pnpm --filter '!./apps/bff' --filter '!./packages/db' --filter '!./packages/ai' --filter '!./packages/auth' -r build

      - name: Run Tests
        run: pnpm test
