name: Temporary 4D PDI remote patch

on:
  push:
    branches:
      - feat/commercial-credit-consumers-4d-pdi
    paths:
      - '.github/workflows/temp-4d-pdi-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-credit-consumers-4d-pdi
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply governed PDI UI patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hook = Path('apps/web/src/features/PDI/usePDIManager.ts')
          text = hook.read_text()

          import_anchor = "import { resolveAuthUid } from '../../utils/authUtils';"
          idx = text.index(import_anchor) + len(import_anchor)
          text = text[:idx] + """
          import { isGovernedCreditConsumerEnabled } from '../../services/credits/creditConsumerFlags';
          import {
            savePdiGeneratedReportGoverned,
            validatePdiAdaptationGoverned,
          } from './PdiCreditService';""" + text[idx:]

          state_anchor = "  const [consolidatorStudent, setConsolidatorStudent] = useState<Student | null>(null);"
          idx = text.index(state_anchor) + len(state_anchor)
          text = text[:idx] + "\n  const [reportArtifactIds, setReportArtifactIds] = useState<Record<string, string>>({});" + text[idx:]

          generation_start = text.index('      const block9Payload = {')
          set_state = text.index('      setAdaptations((prev) => ({', generation_start)
          text = text[:set_state] + '      const artifactId = crypto.randomUUID();\n\n' + text[set_state:]
          payload_property = text.index('          block9Payload,', set_state)
          payload_end = payload_property + len('          block9Payload,')
          text = text[:payload_end] + '\n          ...({ artifactId } as any),' + text[payload_end:]

          validation_start = text.index('  const handleValidate = async')
          legacy_marker = text.index('      let loggedEvent = null;', validation_start)
          governed = """      if (isGovernedCreditConsumerEnabled()) {
                const adaptation = adaptations[studentId] as (StudentAdaptation & {
                  artifactId?: string;
                }) | undefined;
                const payload = adaptation?.block9Payload;
                const artifactId = adaptation?.artifactId;

                if (!schoolStudentId || !payload || !artifactId) {
                  throw new Error('Identidade ou persistência-base do PDI não pôde ser resolvida.');
                }

                const year =
                  typeof selectedClass?.year === 'number'
                    ? selectedClass.year
                    : new Date().getFullYear();
                const { data: pdiDoc, error: pdiError } = await PdiDocumentService.getOrCreatePdi(
                  schoolStudentId,
                  year,
                  { studentName }
                );

                if (pdiError || !pdiDoc?.id) {
                  throw pdiError || new Error('PDI do aluno não pôde ser preparado para validação.');
                }

                const governedResult = await validatePdiAdaptationGoverned({
                  artifactId,
                  pdiDocumentId: pdiDoc.id,
                  studentId: schoolStudentId,
                  lessonId: String(selectedLesson.id),
                  lessonTitle: selectedLesson.topic || selectedLesson.title || 'Aula',
                  subject: selectedClass?.subject || 'Geral',
                  content: finalContent,
                  block9Payload: payload as unknown as Record<string, unknown>,
                });

                setLastAdaptationDetails({
                  id: governedResult.pdi_record_id || artifactId,
                  studentName,
                  lessonTopic: selectedLesson.topic,
                });
                setFeedbackModalOpen(true);
                setAdaptations((prev) => ({
                  ...prev,
                  [studentId]: {
                    ...prev[studentId],
                    status: 'validated',
                  },
                }));
                return;
              }

          """
          text = text[:legacy_marker] + governed + text[legacy_marker:]

          report_start = text.index('  const handleGenerateReport = async')
          save_start = text.index('      try {\n        await saveGeneratedContent(', report_start)
          catch_start = text.index("      } catch (e) {\n        console.warn('Falha no autosave', e);\n      }", save_start)
          catch_end = catch_start + len("      } catch (e) {\n        console.warn('Falha no autosave', e);\n      }")
          report_replacement = """      try {
                if (isGovernedCreditConsumerEnabled()) {
                  const artifactId = reportArtifactIds[student.id] || crypto.randomUUID();
                  if (!reportArtifactIds[student.id]) {
                    setReportArtifactIds((prev) => ({ ...prev, [student.id]: artifactId }));
                  }

                  await savePdiGeneratedReportGoverned({
                    artifactId,
                    title: `RELATORIO PDI - ${student.name}`,
                    content: reportHtml,
                  });

                  setReportArtifactIds((prev) => {
                    const next = { ...prev };
                    delete next[student.id];
                    return next;
                  });
                } else {
                  await saveGeneratedContent(
                    userId,
                    'documento',
                    'PDI',
                    `RELATORIO PDI - ${student.name}`,
                    reportHtml
                  );
                }
              } catch (e) {
                console.warn('Falha no autosave', e);
                throw e;
              }"""
          text = text[:save_start] + report_replacement + text[catch_end:]
          hook.write_text(text)

          editor = Path('apps/web/src/features/PDI/components/PDIBlock11Editor.tsx')
          text = editor.read_text()
          import_anchor = "import { generateBlock11Report } from '../../../services/ai/AiPdiService';"
          idx = text.index(import_anchor) + len(import_anchor)
          text = text[:idx] + """
          import { isGovernedCreditConsumerEnabled } from '../../../services/credits/creditConsumerFlags';
          import { savePdiFinalReportGoverned } from '../PdiCreditService';""" + text[idx:]

          save_anchor = '      await PdiDocumentService.updateBlock11ByProgument(pdiId, supervisorEdit);'
          idx = text.index(save_anchor)
          replacement = """      if (isGovernedCreditConsumerEnabled()) {
                await savePdiFinalReportGoverned(pdiId, supervisorEdit);
              } else {
                await PdiDocumentService.updateBlock11ByProgument(pdiId, supervisorEdit);
              }"""
          text = text[:idx] + replacement + text[idx + len(save_anchor):]
          editor.write_text(text)
          PY

          rm .github/workflows/temp-4d-pdi-patch.yml

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/PDI/usePDIManager.ts \
                  apps/web/src/features/PDI/components/PDIBlock11Editor.tsx \
                  .github/workflows/temp-4d-pdi-patch.yml
          git commit -m 'feat(commercial): govern PDI adaptation and report saves'
          git push origin HEAD:feat/commercial-credit-consumers-4d-pdi
