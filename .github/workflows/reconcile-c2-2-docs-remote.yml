name: Reconcile C.2.2 docs remotely

on:
  push:
    branches:
      - docs/knowledge-factory-c2-2-post-merge

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/knowledge-factory-c2-2-post-merge

      - name: Reconcile Blueprint and Phase C map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          blueprint_path = Path('docs/profeplan-knowledge-factory/BLUEPRINT.md')
          blueprint = blueprint_path.read_text(encoding='utf-8')

          blueprint = replace_once(
              blueprint,
              'FASE C — C.1 CONCLUÍDO; C.2.1 INTEGRADO; C.2.2 BLOQUEADO  ← ESTADO ATUAL',
              'FASE C — C.1 CONCLUÍDO; C.2.1 E C.2.2 INTEGRADOS; C.2.3 BLOQUEADO  ← ESTADO ATUAL',
              'blueprint macro state',
          )
          blueprint = replace_once(
              blueprint,
              '🔵 C.2 Ingestão controlada — definição integrada; C.2.1 integrado pelo PR nº 62; C.2.2 bloqueado',
              '🔵 C.2 Ingestão controlada — definição integrada; C.2.1 e C.2.2 integrados; C.2.3 bloqueado',
              'blueprint C.2 macro row',
          )
          blueprint = replace_once(
              blueprint,
              "C.2.1 foi integrado pelo PR nº 62 no commit\n`e0ba47bf063b324df141c370ebf371763fbf2364`, tree\n`a78d930b9491724c79665e420ceebc609b122d18`, com CI pós-merge nº 373 verde. A superfície contratual\nestá em\n[`12-delivery/LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md`](12-delivery/LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md)\ne o estado pós-merge no Checkpoint 045. C.2.2–C.2.6 e C.3–C.7 permanecem bloqueados.",
              "C.2.1 foi integrado pelo PR nº 62 no commit\n`e0ba47bf063b324df141c370ebf371763fbf2364`, tree\n`a78d930b9491724c79665e420ceebc609b122d18`, com CI pós-merge nº 373 verde. A superfície contratual\nestá em\n[`12-delivery/LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md`](12-delivery/LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md)\ne o estado pós-merge no Checkpoint 045.\n\nC.2.2 foi integrado pelo PR nº 67 no commit\n`7557bc3aa80ce5ebd6423b10a179fa3790b97cb6`, tree\n`61747e439323dcc165c8d3a084e4d73c66f06c4a`, com CI pós-merge nº 412 verde. A fronteira de intake/staging\nestá em\n[`12-delivery/LOT-C2-2-SECURE-STAGING-LIMITS-AND-RETENTION.md`](12-delivery/LOT-C2-2-SECURE-STAGING-LIMITS-AND-RETENTION.md)\ne o estado pós-merge no Checkpoint 046. C.2.3–C.2.6 e C.3–C.7 permanecem bloqueados.",
              'blueprint C.2 status narrative',
          )
          blueprint = replace_once(
              blueprint,
              '| C.2 | Ingestão controlada | EPIC-003; US-003.1 | **C.2.1 integrado; C.2.2 bloqueado** |',
              '| C.2 | Ingestão controlada | EPIC-003; US-003.1 | **C.2.1–C.2.2 integrados; C.2.3 bloqueado** |',
              'blueprint phase C table',
          )
          blueprint_path.write_text(blueprint, encoding='utf-8')

          phase_path = Path('docs/profeplan-knowledge-factory/12-delivery/PHASE-C-EXECUTION-MAP.md')
          phase = phase_path.read_text(encoding='utf-8')

          phase = replace_once(
              phase,
              "Estado canônico após a integração de C.2.1 verificado em 14 de agosto de 2026: `main` em\n`e0ba47bf063b324df141c370ebf371763fbf2364` (PR nº 62), tree\n`a78d930b9491724c79665e420ceebc609b122d18`.",
              "Estado canônico após a integração de C.2.2 verificado em 14 de agosto de 2026: `main` em\n`7557bc3aa80ce5ebd6423b10a179fa3790b97cb6` (PR nº 67), tree\n`61747e439323dcc165c8d3a084e4d73c66f06c4a`.",
              'phase canonical state',
          )
          phase = replace_once(
              phase,
              "Definição integrada de C.2.1:\n[`LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md`](LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md).",
              "Definição integrada de C.2.1:\n[`LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md`](LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md).\n\nDefinição integrada de C.2.2:\n[`LOT-C2-2-SECURE-STAGING-LIMITS-AND-RETENTION.md`](LOT-C2-2-SECURE-STAGING-LIMITS-AND-RETENTION.md).",
              'phase C.2.2 definition link',
          )
          phase = replace_once(
              phase,
              "**C.0 está integrado, C.1 foi concluído integralmente de C.1.1 a C.1.6 e `GAP-3B-04` está\nencerrado. A definição documental de C.2 foi integrada pelo PR nº 59 e C.2.1 foi integrado e\nrevalidado pelo PR nº 62. C.2.2–C.2.6, C.3–C.7, ingestão real, fontes reais, wiring, Supabase\nhospedado, storage real e produção permanecem bloqueados.**",
              "**C.0 está integrado, C.1 foi concluído integralmente de C.1.1 a C.1.6 e `GAP-3B-04` está\nencerrado. A definição documental de C.2 foi integrada pelo PR nº 59, C.2.1 foi integrado e\nrevalidado pelo PR nº 62 e C.2.2 foi integrado e revalidado pelo PR nº 67. C.2.3–C.2.6, C.3–C.7,\ningestão real, fontes reais, wiring, Supabase hospedado, storage hospedado e produção permanecem bloqueados.**",
              'phase status block',
          )
          phase = replace_once(
              phase,
              'A visibilidade de C.2.2–C.7 permanece planejamento, não autorização automática.',
              'A visibilidade de C.2.3–C.7 permanece planejamento, não autorização automática.',
              'phase planning visibility',
          )
          phase = replace_once(
              phase,
              '| C.2 | Entrada controlada de fonte autorizada | EPIC-003; US-003.1 | **C.2.1 integrado; C.2.2 bloqueado** | C.2.1 integrado pelo PR nº 62; Checkpoint 045; C.2.2 exige contexto e DoR próprios |',
              '| C.2 | Entrada controlada de fonte autorizada | EPIC-003; US-003.1 | **C.2.1–C.2.2 integrados; C.2.3 bloqueado** | C.2.2 integrado pelo PR nº 67; Checkpoint 046; C.2.3 exige contexto e DoR próprios |',
              'phase executive table',
          )
          phase = replace_once(
              phase,
              '**Definição documental integrada pelo PR nº 59. C.2.1 integrado e revalidado pelo PR nº 62. C.2.2–C.2.6 permanecem bloqueados.**',
              '**Definição documental integrada pelo PR nº 59. C.2.1 integrado e revalidado pelo PR nº 62. C.2.2 integrado e revalidado pelo PR nº 67. C.2.3–C.2.6 permanecem bloqueados.**',
              'phase C.2 section status',
          )
          phase = replace_once(
              phase,
              "de C.2.1 está em\n[`LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md`](LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md).\nO estado operacional pós-C.2.1 é registrado no Checkpoint 045.",
              "de C.2.1 está em\n[`LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md`](LOT-C2-1-INGESTION-CONTRACTS-AND-STATE-MACHINE.md),\na fronteira integrada de C.2.2 está em\n[`LOT-C2-2-SECURE-STAGING-LIMITS-AND-RETENTION.md`](LOT-C2-2-SECURE-STAGING-LIMITS-AND-RETENTION.md)\ne o estado operacional pós-C.2.2 é registrado no Checkpoint 046.",
              'phase C.2 authority paragraph',
          )
          phase = replace_once(
              phase,
              '- `C.2.2` — intake/staging seguro, limites e retenção — **bloqueado**;',
              '- `C.2.2` — intake/staging seguro, limites e retenção — **concluído**;',
              'phase C.2.2 sublot',
          )
          phase = replace_once(
              phase,
              "C.2.1 não criou staging físico, storage, migration, RPC, adapter, upload, checksum real, conteúdo\nreal ou extração. A conclusão desse sublote não constitui autorização implícita para C.2.2.",
              "C.2.1 não criou staging físico, storage, migration, RPC, adapter, upload, checksum real, conteúdo\nreal ou extração.\n\nC.2.2 criou a fronteira física mínima de intake/staging temporário: porta provider-neutral, policy tipada\nde limites e retenção, lifecycle físico distinto do `processing_run`, adapter Supabase isolado, locator\nopaco, overwrite negado e descarte verificável. A prova integrada usou somente bytes sintéticos e\nSupabase Storage local/descartável no GitHub Actions. Nenhum bucket hospedado, conteúdo real, checksum,\ndeduplicação ou extração foi iniciado. A conclusão de C.2.2 não constitui autorização implícita para C.2.3.",
              'phase C.2.2 result narrative',
          )
          phase_path.write_text(phase, encoding='utf-8')
          PY

      - name: Commit reconciled documents and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile-c2-2-docs-remote.yml
          git add docs/profeplan-knowledge-factory/BLUEPRINT.md \
            docs/profeplan-knowledge-factory/12-delivery/PHASE-C-EXECUTION-MAP.md
          git diff --cached --check
          git commit -m 'docs(knowledge-factory): reconcile C.2.2 navigation'
          git push origin HEAD:docs/knowledge-factory-c2-2-post-merge
