    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
      }
      .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1rem;
      }
      .markdown-content th, .markdown-content td {
        border: 1px solid #e2e8f0;
        padding: 0.75rem;
        text-align: left;
      }
      .markdown-content th {
        background-color: #f8fafc;
        font-weight: 600;
      }
      .markdown-content h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; }
      .markdown-content h2 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; }
      .markdown-content h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; }
      .markdown-content p { margin-bottom: 1rem; line-height: 1.6; }
      .markdown-content ul, .markdown-content ol { margin-left: 1.5rem; margin-bottom: 1rem; }
      .markdown-content li { margin-bottom: 0.25rem; }
      
      /* Esconder scrollbar mas manter funcionalidade */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 3s linear infinite;
      }
    </style>
