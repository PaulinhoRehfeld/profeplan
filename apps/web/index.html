<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Cache Control - Force Fresh Content -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- SERVICE WORKER KILL-SWITCH -->
  <!-- Antes rodava incondicionalmente em TODO carregamento de página, brigando
       com o registro normal do service worker (ReloadPrompt.tsx / VitePWA
       autoUpdate) a cada load — causava churn de unregister/register constante
       (AbortError no console) e falhas transitórias de rede que disparavam
       logout indevido (ver useAppBootstrap.ts). Agora só roda sob pedido
       explícito, igual aos outros resets de emergência. -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (!params.has('kill_sw') && !params.has('force_reset') && !params.has('reset')) return;
      console.log('SW Kill-Switch Active');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let r of registrations) { r.unregister(); console.log('SW Unregistered'); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (let n of names) caches.delete(n);
          console.log('Caches Purged');
        });
      }
    })();
  </script>
  <!-- App Version -->
  <meta name="app-version" content="4.1.1" />
  <meta name="build-date" content="2026-06-20" />

  <title>PROFEPLAN v4.1.1</title>
