<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Cache Control - Force Fresh Content -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- SERVICE WORKER KILL-SWITCH -->
  <script>
    (function () {
      console.log('SW Kill-Switch Active');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let r of registrations) { r.unregister(); console.log('SW Unregistered'); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (let n of names) caches.delete(n);
          console.log('Caches Purged');
        });
      }
    })();
  </script>
  <!-- App Version -->
  <meta name="app-version" content="4.0.1" />
  <meta name="build-date" content="2026-06-14" />
