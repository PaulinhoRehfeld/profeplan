  <!-- SERVICE WORKER KILL-SWITCH -->
  <!-- Antes rodava incondicionalmente em TODO carregamento de página, brigando
       com o registro normal do service worker (ReloadPrompt.tsx / VitePWA
       autoUpdate) a cada load — causava churn de unregister/register constante
       (AbortError no console) e falhas transitórias de rede que disparavam
       logout indevido (ver useAppBootstrap.ts). Agora só roda sob pedido
       explícito, igual aos outros resets de emergência. -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (!params.has('kill_sw') && !params.has('force_reset') && !params.has('reset')) return;
      console.log('SW Kill-Switch Active');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let r of registrations) { r.unregister(); console.log('SW Unregistered'); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (let n of names) caches.delete(n);
          console.log('Caches Purged');
        });
      }
    })();
  </script>

  <!-- CAPACITOR BRIDGE SAFETY + GLOBAL ERROR SILENCER: executa ANTES de qualquer script -->
  <script>
    (function () {
      var win = window;

      // 1. Stub do Capacitor — impede inicialização da ponte nativa
      if (!win.Capacitor) {
        win.Capacitor = {
          isNative: false,
          isPluginAvailable: function () { return false; },
          getPlatform: function () { return 'web'; }
        };
      }

      // 2. Silenciador global de erros de terceiros (extensões Chrome, Capacitor, etc.)
      var SUPPRESS = [
        'deviceAttributes',
        'message channel closed',
        'A listener indicated an asynchronous response',
        'Extension context invalidated',
        'Could not establish connection',
        'Receiving end does not exist',
        'The message port closed'
      ];

      var shouldSuppress = function (msg) {
        msg = String(msg || '').toLowerCase();
        for (var i = 0; i < SUPPRESS.length; i++) {
          if (msg.indexOf(SUPPRESS[i].toLowerCase()) !== -1) return true;
        }
        return false;
      };

      // Intercepta erros síncronos (window.onerror)
      var _oldOnerror = win.onerror;
      win.onerror = function (message, source, lineno, colno, error) {
        if (shouldSuppress(message || (error && error.message))) {
          return true; // suprime o erro
        }
        if (_oldOnerror) return _oldOnerror.apply(this, arguments);
        return false;
      };

      // Intercepta rejeições de promessa não tratadas
      win.addEventListener('unhandledrejection', function (event) {
        var reason = String((event.reason && event.reason.message) || event.reason || '');
        if (shouldSuppress(reason)) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true); // useCapture=true para capturar antes de outros listeners

      // Intercepta window.error para recursos
      win.addEventListener('error', function (event) {
        var msg = String(event.message || '');
        if (shouldSuppress(msg)) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true);
    })();
  </script>
